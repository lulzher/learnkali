
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:transparent}
.wrap{padding:1.25rem;max-width:500px;margin:0 auto}
.title{font-size:21px;font-weight:600;color:var(--color-text-primary);margin-bottom:3px}
.sub{font-size:14px;color:var(--color-text-secondary);margin-bottom:1.25rem}
.prog-wrap{background:var(--color-background-secondary);border-radius:14px;padding:1.1rem 1.25rem;margin-bottom:1.25rem}
.prog-row{display:flex;justify-content:space-between;margin-bottom:8px}
.prog-label{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.prog-val{font-size:13px;color:var(--color-text-secondary)}
.bar-bg{height:7px;background:var(--color-border-tertiary);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:#3182f6;border-radius:99px;transition:width .4s}
.phase-wrap{margin-bottom:1.1rem}
.phase-hd{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.phase-dot{width:9px;height:9px;border-radius:50%}
.phase-nm{font-size:12px;font-weight:600;color:var(--color-text-primary);letter-spacing:.03em}
.phase-mt{font-size:11px;color:var(--color-text-tertiary);margin-left:auto}
.cards{display:flex;flex-direction:column;gap:7px}
.card{background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--color-border-secondary)}
.card.active{border-color:#3182f6}
.card.done{border-color:#22c55e}
.card-top{display:flex;align-items:center;gap:11px;padding:.9rem 1rem}
.num-badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-nm{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.card-ht{font-size:11px;color:var(--color-text-secondary);margin-top:1px}
.chev{font-size:15px;color:var(--color-text-tertiary)}
.body{padding:0 1rem 1rem;display:none}
.body.open{display:block}
.divider{height:.5px;background:var(--color-border-tertiary);margin-bottom:1rem}

/* 개념 블록 */
.concept-block{display:flex;gap:10px;margin-bottom:10px}
.concept-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.concept-lbl{font-size:11px;font-weight:600;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.concept-txt{font-size:13px;color:var(--color-text-primary);line-height:1.6}

/* 비유 */
.tip{background:var(--color-background-secondary);border-radius:10px;padding:.8rem .9rem;margin-bottom:1rem;display:flex;gap:8px;align-items:flex-start}
.tip-emoji{font-size:18px;flex-shrink:0}
.tip-inner{}
.tip-lbl{font-size:11px;font-weight:600;color:var(--color-text-secondary);margin-bottom:3px}
.tip-txt{font-size:13px;color:var(--color-text-primary);line-height:1.6}

/* 퀴즈 */
.quiz-lbl{font-size:12px;font-weight:600;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.quiz-q{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:10px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.opt{border:.5px solid var(--color-border-tertiary);border-radius:10px;padding:.65rem .9rem;font-size:13px;color:var(--color-text-primary);cursor:pointer;text-align:left;background:var(--color-background-primary);transition:all .15s;display:flex;align-items:center;gap:10px}
.opt:hover:not(:disabled){border-color:#3182f6;background:var(--color-background-secondary)}
.opt-num{width:22px;height:22px;border-radius:50%;border:.5px solid var(--color-border-secondary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;color:var(--color-text-secondary)}
.opt.correct{background:#f0fdf4;border-color:#22c55e}
.opt.correct .opt-num{background:#22c55e;color:white;border-color:#22c55e}
.opt.wrong{background:#fff1f2;border-color:#f43f5e}
.opt.wrong .opt-num{background:#f43f5e;color:white;border-color:#f43f5e}
.opt:disabled{cursor:default}
.fb{font-size:13px;font-weight:500;display:none;margin-bottom:10px;padding:.5rem .75rem;border-radius:8px}
.fb.ok{background:#f0fdf4;color:#15803d}
.fb.no{background:#fff1f2;color:#be123c}

/* 더 깊게 배우기 */
.deep-wrap{background:var(--color-background-secondary);border-radius:10px;padding:.9rem;margin-top:4px}
.deep-lbl{font-size:11px;font-weight:600;color:var(--color-text-secondary);margin-bottom:6px}
.deep-txt{font-size:12px;color:var(--color-text-primary);background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);border-radius:8px;padding:.5rem .7rem;line-height:1.5;margin-bottom:7px;user-select:all}
.deep-btn{background:#3182f6;color:white;border:none;border-radius:8px;padding:.55rem 1rem;font-size:12px;font-weight:500;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:5px;transition:background .15s}
.deep-btn:hover{background:#2563eb}
.copy-msg{font-size:11px;color:#22c55e;text-align:center;margin-top:5px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">화이트햇 로드맵 🛡️</div>
  <div class="sub">입문부터 취업까지 — 총 24개 단원</div>
  <div class="prog-wrap">
    <div class="prog-row"><span class="prog-label">전체 진도</span><span class="prog-val" id="pct-txt">0 / 24 완료</span></div>
    <div class="bar-bg"><div class="bar-fill" id="bar" style="width:0%"></div></div>
  </div>
  <div id="phases"></div>
</div>

<script>

  {name:"입문",color:"#9ca3af",period:"1~2개월",pillBg:"#f3f4f6",pillColor:"#6b7280",lessons:[
    {icon:"🐧",name:"칼리 리눅스 설치",hint:"VirtualBox에 칼리 세팅하기",

     quiz:{q:"칼리 리눅스를 가상머신에 설치하는 이유는?",opts:["더 빠르게 실행되서","실수해도 실제 PC가 안전해서","인터넷이 더 빨라서","그냥 멋있어서"],ans:1},

    {icon:"⌨️",name:"터미널 기초 명령어",hint:"ls, cd, pwd, mkdir — 필수 20개",

const TOTAL=phases.reduce((a,p)=>a+p.lessons.length,0);
let done=new Set(),openCard=null;
function cid(pi,li){return pi+'-'+li;}
function updateBar(){
  const p=Math.round(done.size/TOTAL*100);
  document.getElementById('bar').style.width=p+'%';
  document.getElementById('pct-txt').textContent=done.size+' / '+TOTAL+' 완료';
}
function render(){
  const root=document.getElementById('phases');
  root.innerHTML='';
  phases.forEach(function(ph,pi){
    const pdiv=document.createElement('div');
    pdiv.className='phase-wrap';
    const phDone=ph.lessons.filter(function(_,li){return done.has(cid(pi,li));}).length;
    pdiv.innerHTML='<div class="phase-hd"><div class="phase-dot" style="background:'+ph.color+'"></div><span class="phase-nm">'+ph.name+'</span><span class="phase-mt">'+phDone+'/'+ph.lessons.length+' · '+ph.period+'</span></div><div class="cards" id="pc-'+pi+'"></div>';
    root.appendChild(pdiv);
    const pc=document.getElementById('pc-'+pi);
    ph.lessons.forEach(function(l,li){
      const id=cid(pi,li);
      const isDone=done.has(id);
      const isOpen=openCard===id;
      const card=document.createElement('div');
      card.className='card'+(isOpen?' active':'')+(isDone?' done':'');
      let html='<div class="card-top"><div class="num-badge" style="background:'+ph.pillBg+';color:'+ph.color+'">'+(isDone?'✓':l.icon)+'</div><div class="card-info"><div class="card-nm">'+l.name+'</div><div class="card-ht">'+l.hint+'</div></div><span class="chev">'+(isOpen?'▲':'▽')+'</span></div>';
      if(isOpen){
        html+='<div class="body open"><div class="divider"></div>';
        l.concepts.forEach(function(c){
          html+='<div class="concept-block"><div class="concept-icon">'+c.emoji+'</div><div><div class="concept-lbl">'+c.lbl+'</div><div class="concept-txt">'+c.txt+'</div></div></div>';
        });
        html+='<div class="tip"><div class="tip-emoji">'+l.tipEmoji+'</div><div class="tip-inner"><div class="tip-lbl">비유로 이해하기</div><div class="tip-txt">'+l.tip+'</div></div></div>';
        html+='<div class="quiz-lbl">확인 문제</div><div class="quiz-q">'+l.quiz.q+'</div>';
        html+='<div class="opts" id="opts-'+id+'">';
        const letters=['A','B','C','D'];
        l.quiz.opts.forEach(function(o,oi){
          html+='<button class="opt" data-id="'+id+'" data-oi="'+oi+'" data-ans="'+l.quiz.ans+'"><span class="opt-num">'+letters[oi]+'</span>'+o+'</button>';
        });
        html+='</div><div class="fb" id="fb-'+id+'"></div>';
        html+='<div class="deep-wrap"><div class="deep-lbl">📖 더 깊게 배우기 — 이 텍스트를 복사해서 채팅에 붙여넣어요</div><div class="deep-txt" id="dt-'+id+'">'+l.deep+'</div><button class="deep-btn" data-deepid="'+id+'">📋 질문 복사하기</button><div class="copy-msg" id="cm-'+id+'">✓ 복사됐어요! 채팅창에 붙여넣기 해봐요</div></div>';
        html+='</div>';
      } else {
        html+='<div class="body"></div>';
      }
      card.innerHTML=html;
      card.querySelector('.card-top').addEventListener('click',function(){openCard=(openCard===id?null:id);render();});
      pc.appendChild(card);
    });
  });
  document.querySelectorAll('.opt').forEach(function(btn){
    btn.addEventListener('click',function(){
      var id=this.dataset.id,chosen=parseInt(this.dataset.oi),ans=parseInt(this.dataset.ans);
      var opts=document.querySelectorAll('#opts-'+id+' .opt');
      opts.forEach(function(o,oi){
        if(oi===ans)o.classList.add('correct');
        else if(oi===chosen&&oi!==ans)o.classList.add('wrong');
        o.disabled=true;
      });
      var fb=document.getElementById('fb-'+id);
      if(chosen===ans){
        fb.textContent='🎉 정답이에요! 다음 단원으로 넘어가봐요.';
        fb.className='fb ok';fb.style.display='block';
        done.add(id);updateBar();render();
      } else {
        fb.textContent='❌ 아쉬워요. 설명을 다시 읽고 도전해봐요!';
        fb.className='fb no';fb.style.display='block';
      }
    });
  });
  document.querySelectorAll('.deep-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      var did=this.dataset.deepid;
      var txt=document.getElementById('dt-'+did).textContent;
      navigator.clipboard.writeText(txt).then(function(){
        var cm=document.getElementById('cm-'+did);
        cm.style.display='block';
        setTimeout(function(){cm.style.display='none';},3000);
      }).catch(function(){
        var cm=document.getElementById('cm-'+did);
        cm.textContent='텍스트를 직접 드래그해서 복사해봐요!';
        cm.style.display='block';
      });
    });
  });
  updateBar();
}
render();
</script>
</body>
</html>
