
<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:transparent}
.wrap{padding:1.25rem;max-width:500px;margin:0 auto}
.title{font-size:21px;font-weight:600;color:var(--color-text-primary);margin-bottom:3px}
.sub{font-size:14px;color:var(--color-text-secondary);margin-bottom:1.25rem}
.prog-wrap{background:var(--color-background-secondary);border-radius:14px;padding:1.1rem 1.25rem;margin-bottom:1.25rem}
.prog-row{display:flex;justify-content:space-between;margin-bottom:8px}
.prog-label{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.prog-val{font-size:13px;color:var(--color-text-secondary)}
.bar-bg{height:7px;background:var(--color-border-tertiary);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:#3182f6;border-radius:99px;transition:width .4s}
.phase-wrap{margin-bottom:1.1rem}
.phase-hd{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.phase-dot{width:9px;height:9px;border-radius:50%}
.phase-nm{font-size:12px;font-weight:600;color:var(--color-text-primary)}
.phase-mt{font-size:11px;color:var(--color-text-tertiary);margin-left:auto}
.cards{display:flex;flex-direction:column;gap:7px}
.card{background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--color-border-secondary)}
.card.active{border-color:#3182f6}
.card.done{border-color:#22c55e}
.card-top{display:flex;align-items:center;gap:11px;padding:.9rem 1rem}
.num-badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0}
.card-info{flex:1}
.card-nm{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.card-ht{font-size:11px;color:var(--color-text-secondary);margin-top:1px}
.chev{font-size:13px;color:var(--color-text-tertiary)}
.body{padding:0 1rem 1rem;display:none}
.body.open{display:block}
.divider{height:.5px;background:var(--color-border-tertiary);margin-bottom:1rem}
.concept-block{display:flex;gap:10px;margin-bottom:10px}
.concept-icon{font-size:18px;flex-shrink:0;margin-top:2px}
.concept-lbl{font-size:11px;font-weight:600;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.concept-txt{font-size:13px;color:var(--color-text-primary);line-height:1.6}
.tip{background:var(--color-background-secondary);border-radius:10px;padding:.8rem .9rem;margin-bottom:1rem;display:flex;gap:8px}
.tip-emoji{font-size:16px;flex-shrink:0;margin-top:2px}
.tip-lbl{font-size:11px;font-weight:600;color:var(--color-text-secondary);margin-bottom:3px}
.tip-txt{font-size:13px;color:var(--color-text-primary);line-height:1.6}
.quiz-lbl{font-size:11px;font-weight:600;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.quiz-q{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:10px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.opt{border:.5px solid var(--color-border-tertiary);border-radius:10px;padding:.6rem .9rem;font-size:13px;color:var(--color-text-primary);cursor:pointer;text-align:left;background:var(--color-background-primary);transition:all .15s;display:flex;align-items:center;gap:10px;width:100%}
.opt:hover:not(:disabled){border-color:#3182f6;background:var(--color-background-secondary)}
.opt-num{width:22px;height:22px;border-radius:50%;border:.5px solid var(--color-border-secondary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;color:var(--color-text-secondary);transition:all .15s}
.opt.correct{background:#f0fdf4;border-color:#22c55e}
.opt.correct .opt-num{background:#22c55e;color:white;border-color:#22c55e}
.opt.wrong{background:#fff1f2;border-color:#f43f5e}
.opt.wrong .opt-num{background:#f43f5e;color:white;border-color:#f43f5e}
.opt:disabled{cursor:default}
.fb{font-size:13px;font-weight:500;display:none;margin-bottom:10px;padding:.5rem .75rem;border-radius:8px}
.fb.ok{background:#f0fdf4;color:#15803d;display:block}
.fb.no{background:#fff1f2;color:#be123c;display:block}
.deep-btn{margin-top:4px;border:.5px solid var(--color-border-secondary);border-radius:10px;padding:.65rem 1rem;font-size:13px;color:var(--color-text-primary);cursor:pointer;background:var(--color-background-secondary);width:100%;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.deep-btn:hover{background:var(--color-background-primary)}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">화이트햇 로드맵 🛡️</div>
  <div class="sub">입문부터 취업까지 — 총 24개 단원</div>
  <div class="prog-wrap">
    <div class="prog-row"><span class="prog-label">전체 진도</span><span class="prog-val" id="pct-txt">0 / 24 완료</span></div>
    <div class="bar-bg"><div class="bar-fill" id="bar" style="width:0%"></div></div>
  </div>
  <div id="phases"></div>
</div>
<script>
const phases=[
  {name:"입문",color:"#9ca3af",period:"1~2개월",pillBg:"#f3f4f6",pillColor:"#6b7280",lessons:[
    {icon:"🐧",name:"칼리 리눅스 설치",hint:"VirtualBox에 칼리 세팅하기",concepts:[{e:"💻",l:"왜 가상머신?",t:"칼리를 내 컴퓨터에 직접 설치하면 위험할 수 있어. 가상머신은 컴퓨터 안에 또 다른 컴퓨터를 만드는 것. 실수해도 내 PC는 안전해."},{e:"📦",l:"VirtualBox",t:"무료 가상머신 프로그램이야. 칼리 공식 사이트에서 ISO 파일 받아서 올리면 끝."}],te:"🏖️",tip:"가상머신 = 컴퓨터 속 컴퓨터. 모래 놀이터처럼 마음껏 망가뜨려도 돼.",quiz:{q:"칼리 리눅스를 가상머신에 설치하는 이유는?",o:["더 빠르게 실행되서","실수해도 실제 PC가 안전해서","인터넷이 더 빨라서","그냥 멋있어서"],a:1},deep:"칼리 리눅스 설치 단원을 더 자세히 가르쳐줘. VirtualBox 설치부터 칼리 부팅까지 단계별 실습 예제 포함해서."},
    {icon:"⌨️",name:"터미널 기초 명령어",hint:"ls, cd, pwd, mkdir — 필수 20개",concepts:[{e:"🖥️",l:"왜 터미널?",t:"GUI(클릭)로는 해킹 도구를 제대로 못 써. 터미널은 컴퓨터한테 직접 명령을 내리는 방식이야."},{e:"📝",l:"필수 명령어",t:"ls(목록 보기), cd(이동), pwd(현재 위치), mkdir(폴더 만들기), cat(파일 내용 보기). 이 5개만 알아도 기본은 돼."}],te:"🎙️",tip:"터미널 명령어 = 음성 명령. '파일 열어줘' 대신 'cat 파일명' 타이핑하는 것뿐이야.",quiz:{q:"현재 폴더 위치를 확인하는 명령어는?",o:["ls","cd","pwd","mkdir"],a:2},deep:"터미널 기초 명령어를 더 자세히 가르쳐줘. 실제로 쳐볼 수 있는 실습 예제 20개 포함해서."},
    {icon:"🌐",name:"네트워크 기초",hint:"IP, DNS, 포트 — 해킹의 언어",concepts:[{e:"🏠",l:"IP & 포트",t:"IP는 컴퓨터 주소, 포트는 그 컴퓨터의 문 번호야. 80번=웹, 443=보안웹, 22=SSH. 해킹은 열린 문을 찾는 것."},{e:"📖",l:"DNS",t:"google.com을 입력하면 DNS가 숫자 IP로 바꿔줘. 인터넷 전화번호부랑 같아."}],te:"🏢",tip:"IP:포트 = 아파트 주소:호수. 찾아가려면 둘 다 알아야 해.",quiz:{q:"HTTPS 기본 포트 번호는?",o:["80","22","443","3306"],a:2},deep:"네트워크 기초를 더 자세히 가르쳐줘. IP, 포트, DNS를 칼리 리눅스에서 직접 확인하는 실습 예제 포함해서."},
    {icon:"📡",name:"HTTP 완전 정복",hint:"요청/응답 구조 이해",concepts:[{e:"✉️",l:"HTTP 요청",t:"브라우저가 서버한테 보내는 편지야. GET(가져와), POST(보낼게), 헤더(메타정보), 바디(내용)로 구성돼."},{e:"🔢",l:"상태 코드",t:"200=성공, 403=금지, 404=없음, 500=서버오류. 해킹할 때 이 숫자가 힌트가 돼."}],te:"🍽️",tip:"HTTP = 식당 주문. 손님(브라우저)이 주문서 쓰고, 주방(서버)이 음식(HTML) 내보내는 것.",quiz:{q:"로그인 시 아이디/비밀번호 전송에 쓰는 메서드는?",o:["GET","POST","DELETE","PUT"],a:1},deep:"HTTP 완전 정복을 더 자세히 가르쳐줘. GET/POST 차이, 헤더 구조, 상태코드 실습 예제 포함해서."}
  ]},
  {name:"초급",color:"#3182f6",period:"2~3개월",pillBg:"#eff6ff",pillColor:"#1d4ed8",lessons:[
    {icon:"🔍",name:"Burp Suite 세팅",hint:"프록시 설정 + 첫 인터셉트",concepts:[{e:"🕵️",l:"Burp Suite란?",t:"브라우저와 서버 사이에 끼어드는 도구(프록시)야. 내가 보내는 모든 HTTP 요청을 잡아서 수정할 수 있어."},{e:"⚙️",l:"인터셉트",t:"Burp 켜고 브라우저 프록시를 127.0.0.1:8080으로 설정하면 요청이 화면에서 멈춰. 거기서 파라미터를 바꿔."}],te:"📬",tip:"Burp = 내 편지를 뜯어서 내용 바꾼 뒤 다시 봉투에 넣어 보내는 집배원.",quiz:{q:"Burp Suite 기본 프록시 주소는?",o:["192.168.1.1:80","127.0.0.1:8080","0.0.0.0:443","localhost:3000"],a:1},deep:"Burp Suite 세팅을 더 자세히 가르쳐줘. 설치부터 첫 인터셉트까지 단계별 실습 예제 포함해서."},
    {icon:"💉",name:"XSS 실습",hint:"PortSwigger Lab에서 직접 공격",concepts:[{e:"↩️",l:"Reflected XSS",t:"URL 파라미터에 스크립트 태그를 넣으면 서버가 그대로 출력해서 실행돼. 가장 기본 XSS야."},{e:"💣",l:"Stored XSS",t:"댓글·프로필 저장되는 곳에 코드를 넣으면 그 페이지를 보는 모든 사람한테 실행돼. 훨씬 위험해."}],te:"💡",tip:"Reflected=부메랑(내가 던진 게 바로 돌아옴). Stored=지뢰(심어두면 나중에 다른 사람이 밟음).",quiz:{q:"Stored XSS가 Reflected보다 더 위험한 이유는?",o:["코드가 더 짧아서","페이지 보는 모든 사람한테 실행돼서","서버를 다운시켜서","탐지 불가능해서"],a:1},deep:"XSS 실습을 더 자세히 가르쳐줘. PortSwigger 랩 풀이 방법이랑 실제 페이로드 예제 포함해서."},
    {icon:"🗄️",name:"SQL 인젝션 실습",hint:"DVWA에서 DB 직접 털어보기",concepts:[{e:"🏋️",l:"DVWA란?",t:"일부러 취약하게 만든 연습용 웹사이트야. 여기서 합법적으로 마음껏 공격 연습을 해."},{e:"🔑",l:"기본 페이로드",t:"' OR '1'='1 로 비밀번호 없이 로그인. UNION SELECT로 DB 정보 추출. 이 두 가지가 SQLi의 기본이야."}],te:"🥊",tip:"DVWA = 해킹 연습용 샌드백. 진짜 사이트 건드리기 전에 여기서 실컷 연습해.",quiz:{q:"SQL 인젝션 연습에 쓰는 합법적 환경은?",o:["실제 기업 사이트","DVWA 같은 취약한 연습 앱","친구 블로그","아무 사이트나"],a:1},deep:"SQL 인젝션 실습을 더 자세히 가르쳐줘. DVWA 세팅부터 기본 페이로드 실습까지 단계별로 포함해서."},
    {icon:"🗺️",name:"정보 수집 (Recon)",hint:"Nmap, Whois, Shodan 사용법",concepts:[{e:"🔎",l:"왜 Recon이 중요?",t:"공격 전에 목표를 먼저 파악해야 해. 열린 포트, 서버 소프트웨어 버전 — 이게 다 공격 포인트가 돼."},{e:"📡",l:"Nmap",t:"포트 스캐너야. nmap -sV 대상IP 하면 열린 포트랑 서비스 버전이 줄줄이 나와."}],te:"🗂️",tip:"Recon = 침입 전에 건물 도면 보는 것. 아는 만큼 잘 들어가.",quiz:{q:"Nmap의 주요 용도는?",o:["웹사이트 디자인 분석","열린 포트와 서비스 버전 확인","비밀번호 해독","파일 암호화"],a:1},deep:"정보 수집(Recon)을 더 자세히 가르쳐줘. Nmap, Whois, Shodan 실습 명령어 예제 포함해서."}
  ]},
  {name:"중급",color:"#16a34a",period:"3~6개월",pillBg:"#f0fdf4",pillColor:"#15803d",lessons:[
    {icon:"🏆",name:"OWASP Top 10",hint:"웹 해킹 핵심 취약점 10가지",concepts:[{e:"📋",l:"OWASP란?",t:"웹 보안 비영리 단체야. 가장 많이 발견되는 취약점 10개를 발표해. 버그바운티 헌터는 이 10개를 손으로 찾을 수 있어야 해."},{e:"🥇",l:"대표 항목",t:"Broken Access Control(1위), SQLi, XSS, Insecure Design, Misconfiguration. 이 5개가 버그바운티 수입의 80%야."}],te:"📚",tip:"OWASP Top 10 = 해킹 시험 족보. 이거 외우면 어디서든 써먹어.",quiz:{q:"OWASP Top 10 2021 기준 1위 취약점은?",o:["SQL Injection","XSS","Broken Access Control","Cryptographic Failures"],a:2},deep:"OWASP Top 10을 더 자세히 가르쳐줘. 각 항목별 개념이랑 실제 예시 포함해서."},

const TOTAL=phases.reduce(function(a,p){return a+p.lessons.length;},0);
var done=new Set(), openCard=null;
function cid(pi,li){return pi+'-'+li;}
function updateBar(){
  var p=Math.round(done.size/TOTAL*100);
  document.getElementById('bar').style.width=p+'%';
  document.getElementById('pct-txt').textContent=done.size+' / '+TOTAL+' 완료';
}

function render(){
  var root=document.getElementById('phases');
  root.innerHTML='';
  phases.forEach(function(ph,pi){
    var pdiv=document.createElement('div');
    pdiv.className='phase-wrap';
    var phDone=ph.lessons.filter(function(_,li){return done.has(cid(pi,li));}).length;
    pdiv.innerHTML='<div class="phase-hd"><div class="phase-dot" style="background:'+ph.color+'"></div><span class="phase-nm">'+ph.name+'</span><span class="phase-mt">'+phDone+'/'+ph.lessons.length+' · '+ph.period+'</span></div><div class="cards" id="pc-'+pi+'"></div>';
    root.appendChild(pdiv);
    var pc=document.getElementById('pc-'+pi);
    ph.lessons.forEach(function(l,li){
      var id=cid(pi,li);
      var isDone=done.has(id);
      var isOpen=openCard===id;
      var card=document.createElement('div');
      card.className='card'+(isOpen?' active':'')+(isDone?' done':'');
      var html='<div class="card-top"><div class="num-badge" style="background:'+ph.pillBg+';color:'+ph.color+'">'+(isDone?'✓':l.icon)+'</div><div class="card-info"><div class="card-nm">'+l.name+'</div><div class="card-ht">'+l.hint+'</div></div><span class="chev">'+(isOpen?'▲':'▽')+'</span></div>';
      if(isOpen){
        html+='<div class="body open"><div class="divider"></div>';
        l.concepts.forEach(function(c){
          html+='<div class="concept-block"><div class="concept-icon">'+c.e+'</div><div><div class="concept-lbl">'+c.l+'</div><div class="concept-txt">'+c.t+'</div></div></div>';
        });
        html+='<div class="tip"><div class="tip-emoji">'+l.te+'</div><div><div class="tip-lbl">비유로 이해하기</div><div class="tip-txt">'+l.tip+'</div></div></div>';
        html+='<div class="quiz-lbl">확인 문제</div><div class="quiz-q">'+l.quiz.q+'</div>';
        html+='<div class="opts" id="opts-'+id+'">';
        var letters=['A','B','C','D'];
        l.quiz.o.forEach(function(o,oi){
          html+='<button class="opt" data-id="'+id+'" data-oi="'+oi+'" data-ans="'+l.quiz.a+'"><span class="opt-num">'+letters[oi]+'</span>'+o+'</button>';
        });
        html+='</div><div class="fb" id="fb-'+id+'"></div>';
        html+='<button class="deep-btn" data-prompt="'+l.deep+'">📖 이 단원 더 깊게 배우기</button>';
        html+='</div>';
      } else {
        html+='<div class="body"></div>';
      }
      card.innerHTML=html;
      card.querySelector('.card-top').addEventListener('click',function(){
        openCard=(openCard===id?null:id); render();
      });
      pc.appendChild(card);
    });
  });

  // 퀴즈 버튼
  document.querySelectorAll('.opt').forEach(function(btn){
    btn.addEventListener('click',function(){
      var id=this.dataset.id;
      var chosen=parseInt(this.dataset.oi);
      var ans=parseInt(this.dataset.ans);
      var allOpts=document.querySelectorAll('#opts-'+id+' .opt');
      // 모든 버튼 비활성화 먼저
      allOpts.forEach(function(o){ o.disabled=true; });
      // 정답 표시
      allOpts[ans].classList.add('correct');
      // 오답 선택 시 표시
      if(chosen!==ans){ allOpts[chosen].classList.add('wrong'); }
      var fb=document.getElementById('fb-'+id);
      if(chosen===ans){
        fb.textContent='🎉 정답이에요! 다음 단원으로 넘어가봐요.';
        fb.className='fb ok';
        done.add(id);
        updateBar();
        // 잠깐 뒤 카드 닫고 re-render (done 체크 표시)
        setTimeout(function(){ render(); },800);
      } else {
        fb.textContent='❌ 아쉬워요. 설명을 다시 읽고 도전해봐요!';
        fb.className='fb no';
      }
    });
  });

  // 더 깊게 배우기 버튼 — sendPrompt 시도, 실패하면 alert
  document.querySelectorAll('.deep-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      var prompt=this.dataset.prompt;
      try{
        sendPrompt(prompt);
      } catch(e){
        // sendPrompt 안되는 환경이면 안내
        var msg='아래 질문을 채팅창에 입력해봐요!\n\n'+prompt;
        alert(msg);
      }
    });
  });

  updateBar();
}

render();
</script>
</body>
</html>
