
<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{padding:1.5rem;max-width:500px;margin:0 auto}
.greeting{font-size:22px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.sub{font-size:15px;color:var(--color-text-secondary);margin-bottom:1.5rem;line-height:1.6}
.prog-wrap{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:1.5rem}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.prog-title{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.prog-pct{font-size:14px;color:var(--color-text-secondary)}
.bar-bg{height:8px;background:var(--color-border-tertiary);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:#3182f6;border-radius:99px;transition:width 0.4s}
.phase-wrap{margin-bottom:1.25rem}
.phase-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.phase-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.phase-name{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.phase-meta{font-size:12px;color:var(--color-text-secondary);margin-left:auto}
.phase-cards{display:flex;flex-direction:column;gap:8px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.15rem;cursor:pointer;transition:border-color 0.15s}

.card.active{border-color:#3182f6}
.card.done{border-color:var(--color-border-success)}
.card-top{display:flex;align-items:center;gap:12px}
.step-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
.card-info{flex:1}
.card-name{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.card-hint{font-size:12px;color:var(--color-text-secondary);margin-top:1px}
.lesson{margin-top:1rem;padding-top:1rem;border-top:0.5px solid var(--color-border-tertiary);display:none}
.lesson.open{display:block}
.pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:99px;margin-bottom:10px;font-weight:500}
.concept{margin-bottom:12px}
.clbl{font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.05em}
.ctxt{font-size:13px;color:var(--color-text-primary);line-height:1.65}
.tip-box{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:0.85rem;margin-bottom:12px}
.tip-lbl{font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:4px}
.tip-txt{font-size:13px;color:var(--color-text-primary);line-height:1.6}
.qlbl{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:0.65rem 0.9rem;font-size:13px;color:var(--color-text-primary);cursor:pointer;text-align:left;transition:all 0.15s}
.opt:hover{border-color:#3182f6}
.opt.correct{background:var(--color-background-success);border-color:var(--color-border-success);color:var(--color-text-success)}
.opt.wrong{background:var(--color-background-danger);border-color:var(--color-border-danger);color:var(--color-text-danger)}
.fb{font-size:13px;margin-top:8px;font-weight:500;display:none}
.deep-btn{margin-top:10px;background:transparent;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:0.6rem 1rem;font-size:13px;color:var(--color-text-primary);cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;transition:background 0.15s}
.deep-btn:hover{background:var(--color-background-secondary)}
</style>

<h2 class="sr-only">화이트햇 해커 전체 커리큘럼</h2>
<div class="wrap">
  <div class="greeting">화이트햇 로드맵</div>
  <div class="sub">입문부터 취업까지 — 총 24개 단원</div>
  <div class="prog-wrap">
    <div class="prog-top">
      <span class="prog-title">전체 진도</span>
      <span class="prog-pct" id="pct-txt">0 / 24 완료</span>
    </div>
    <div class="bar-bg"><div class="bar-fill" id="bar" style="width:0%"></div></div>
  </div>
  <div id="phases"></div>
</div>

<script>
const phases = [
  {
    name:"입문", color:"#888780", period:"1~2개월", pillBg:"#F1EFE8", pillColor:"#5F5E5A",
    lessons:[
      { name:"칼리 리눅스 설치", hint:"VirtualBox에 칼리 세팅하기",
        concepts:[{lbl:"왜 가상머신?",txt:"칼리를 내 컴퓨터에 직접 설치하면 위험할 수 있어. 가상머신은 컴퓨터 안에 또 다른 컴퓨터를 만드는 것. 실수해도 내 PC는 안전해."},{lbl:"VirtualBox",txt:"무료 가상머신 프로그램이야. 여기에 칼리를 설치하면 돼. 칼리 공식 사이트에서 ISO 파일 받아서 올리면 끝."}],
        tip:"가상머신 = 컴퓨터 속 컴퓨터. 모래 놀이터처럼 마음껏 망가뜨려도 돼.",
        quiz:{q:"칼리 리눅스를 가상머신에 설치하는 이유는?",opts:["더 빠르게 실행되서","실수해도 실제 PC가 안전해서","인터넷이 더 빨라서","그냥 멋있어서"],ans:1}},
      { name:"터미널 기초 명령어", hint:"ls, cd, pwd, mkdir — 필수 20개",
        concepts:[{lbl:"왜 터미널?",txt:"GUI(클릭)로는 해킹 도구를 제대로 못 써. 터미널은 컴퓨터한테 직접 명령을 내리는 방식이야. 처음엔 낯설지만 금방 익숙해져."},{lbl:"필수 명령어",txt:"ls(목록 보기), cd(이동), pwd(현재 위치), mkdir(폴더 만들기), cat(파일 내용 보기). 이 5개만 알아도 기본은 돼."}],
        tip:"터미널 명령어 = 스마트폰 음성 명령. '파일 열어줘' 대신 'cat 파일명'이라고 타이핑하는 것뿐이야.",
        quiz:{q:"현재 폴더 위치를 확인하는 명령어는?",opts:["ls","cd","pwd","mkdir"],ans:2}},
      { name:"네트워크 기초", hint:"IP, DNS, 포트 — 해킹의 언어",
        concepts:[{lbl:"IP & 포트",txt:"IP는 컴퓨터 주소, 포트는 그 컴퓨터의 문 번호야. 80번은 웹(HTTP), 443은 보안 웹(HTTPS), 22번은 SSH. 해킹은 열린 문을 찾는 것."},{lbl:"DNS",txt:"google.com을 입력하면 DNS가 숫자 IP 주소로 바꿔줘. 전화번호부랑 같아."}],
        tip:"IP:포트 = 아파트 주소:호수. 찾아가려면 둘 다 알아야 해.",
        quiz:{q:"HTTPS 기본 포트 번호는?",opts:["80","22","443","3306"],ans:2}},
      { name:"HTTP 완전 정복", hint:"요청/응답 구조 이해",
        concepts:[{lbl:"HTTP 요청",txt:"브라우저가 서버한테 보내는 편지야. GET(가져와), POST(보낼게), 헤더(메타정보), 바디(실제 내용)로 구성돼."},{lbl:"상태 코드",txt:"200=성공, 301=이동, 403=금지, 404=없음, 500=서버 오류. 해킹할 때 이 숫자가 힌트가 돼."}],
        tip:"HTTP = 식당 주문. 손님(브라우저)이 주문서 쓰고, 주방(서버)이 음식(HTML) 내보내는 것.",
        quiz:{q:"로그인 시 아이디/비밀번호 전송에 쓰는 메서드는?",opts:["GET","POST","DELETE","PUT"],ans:1}}
    ]
  },
  {
    name:"초급", color:"#185FA5", period:"2~3개월", pillBg:"#E6F1FB", pillColor:"#0C447C",
    lessons:[
      { name:"Burp Suite 세팅", hint:"프록시 설정 + 첫 인터셉트",
        concepts:[{lbl:"Burp Suite란?",txt:"브라우저와 서버 사이에 끼어드는 도구(프록시)야. 내가 보내는 모든 HTTP 요청을 화면에서 잡아서 수정할 수 있어."},{lbl:"인터셉트",txt:"Burp를 켜고 브라우저 프록시를 127.0.0.1:8080으로 설정하면 요청이 Burp 화면에서 멈춰. 거기서 파라미터를 바꿔서 서버로 보내는 거야."}],
        tip:"Burp = 내 편지를 뜯어서 내용을 바꾼 뒤 다시 봉투에 넣어 보내는 우편집배원.",
        quiz:{q:"Burp Suite의 기본 프록시 주소는?",opts:["192.168.1.1:80","127.0.0.1:8080","0.0.0.0:443","localhost:3000"],ans:1}},
      { name:"XSS 실습", hint:"PortSwigger Lab에서 직접 공격",
        concepts:[{lbl:"Reflected XSS",txt:"URL 파라미터에 script 태그를 넣으면 서버가 그대로 출력해서 실행돼. 가장 기본 XSS야."},{lbl:"Stored XSS",txt:"댓글·프로필 등 저장되는 곳에 코드를 넣으면, 그 페이지를 보는 모든 사람한테 실행돼. Reflected보다 훨씬 위험해."}],
        tip:"Reflected = 부메랑. 내가 던진 게 바로 돌아옴. Stored = 지뢰. 심어두면 나중에 다른 사람이 밟음.",
        quiz:{q:"Stored XSS가 Reflected보다 더 위험한 이유는?",opts:["코드가 더 짧아서","페이지를 보는 모든 사람한테 실행돼서","서버를 다운시켜서","탐지가 불가능해서"],ans:1}},
      { name:"SQL 인젝션 실습", hint:"DVWA에서 DB 직접 털어보기",
        concepts:[{lbl:"DVWA란?",txt:"일부러 취약하게 만든 연습용 웹사이트야. 여기서 합법적으로 마음껏 공격 연습을 해."},{lbl:"기본 페이로드",txt:"' OR '1'='1 로 비밀번호 없이 로그인. UNION SELECT로 DB 정보 추출. 이 두 가지가 SQLi의 기본이야."}],
        tip:"DVWA = 해킹 연습용 샌드백. 진짜 사이트 건드리기 전에 여기서 실컷 연습해.",
        quiz:{q:"SQL 인젝션 연습에 쓰는 합법적 환경은?",opts:["실제 기업 사이트","DVWA 같은 취약한 연습 앱","친구 블로그","아무 사이트나"],ans:1}},
      { name:"정보 수집 (Recon)", hint:"Nmap, Whois, Shodan 사용법",
        concepts:[{lbl:"왜 Recon이 중요?",txt:"공격 전에 목표를 먼저 파악해야 해. 어떤 포트가 열렸는지, 어떤 서버 소프트웨어인지 — 이게 다 공격 포인트가 돼."},{lbl:"Nmap",txt:"포트 스캐너야. nmap -sV 대상IP 하면 열린 포트랑 서비스 버전이 줄줄이 나와. 버그바운티에서 공격 표면을 찾는 핵심 도구."}],
        tip:"Recon = 집 털기 전에 건물 도면 보는 것. 아는 만큼 잘 들어가.",
        quiz:{q:"Nmap의 주요 용도는?",opts:["웹사이트 디자인 분석","열린 포트와 서비스 버전 확인","비밀번호 해독","파일 암호화"],ans:1}}
    ]
  },
  {
    name:"중급", color:"#3B6D11", period:"3~6개월", pillBg:"#EAF3DE", pillColor:"#27500A",
    lessons:[
      { name:"OWASP Top 10", hint:"웹 해킹 핵심 취약점 10가지",
        concepts:[{lbl:"OWASP란?",txt:"웹 보안 비영리 단체야. 가장 많이 발견되는 취약점 10개를 발표해. 버그바운티 헌터는 이 10개를 손으로 찾을 수 있어야 해."},{lbl:"대표 항목",txt:"Broken Access Control(1위), SQL Injection, XSS, Insecure Design, Security Misconfiguration. 이 5개가 버그바운티 수입의 80%야."}],
        tip:"OWASP Top 10 = 해킹 시험 족보. 이거 외우면 어디서든 써먹어.",
        quiz:{q:"OWASP Top 10 2021 기준 1위 취약점은?",opts:["SQL Injection","XSS","Broken Access Control","Cryptographic Failures"],ans:2}},
      { name:"인증/세션 취약점", hint:"JWT, 쿠키, 세션 하이재킹",
        concepts:[{lbl:"세션 하이재킹",txt:"로그인하면 서버가 쿠키를 줘. 이게 '인증됨' 티켓이야. XSS로 이 쿠키를 훔치면 그 사람 계정으로 로그인할 수 있어."},{lbl:"JWT 취약점",txt:"alg를 none으로 바꾸거나 약한 시크릿 키를 쓰면 위조가 가능해. 많은 버그바운티에서 나오는 취약점이야."}],
        tip:"쿠키 = 놀이공원 손목 스탬프. 훔치면 그 사람인 척 재입장 가능.",
        quiz:{q:"XSS로 탈취한 쿠키로 할 수 있는 것은?",opts:["서버 종료","피해자 계정으로 로그인","DB 삭제","파일 다운로드"],ans:1}},
      { name:"API 해킹", hint:"REST API, GraphQL 취약점",
        concepts:[{lbl:"왜 API가 중요?",txt:"요즘 앱은 거의 다 API로 동작해. Burp로 요청을 잡으면 API 엔드포인트가 보여. 여기서 권한 우회, 데이터 노출 버그가 많이 나와."},{lbl:"IDOR",txt:"Insecure Direct Object Reference. /api/user/1234를 /api/user/1235로 바꿨더니 다른 사람 정보가 나오는 것. 버그바운티 최다 발견 취약점 중 하나야."}],
        tip:"IDOR = 식당에서 '5번 테이블 주문 주세요' 했더니 6번 주문도 받아오는 것.",
        quiz:{q:"IDOR 취약점의 핵심 원인은?",opts:["암호화 오류","서버가 권한 확인을 안 해서","네트워크 속도 문제","프론트엔드 버그"],ans:1}},
      { name:"CTF 입문", hint:"HackTheBox Easy 머신 풀기",
        concepts:[{lbl:"CTF란?",txt:"Capture The Flag. 해킹 대회야. 취약한 서버에서 flag.txt를 찾아서 제출하면 점수를 받아. 실력 증명 + 취업 포트폴리오까지."},{lbl:"HackTheBox",txt:"전 세계 해커들이 쓰는 플랫폼이야. Retired 머신은 공략법이 공개돼서 따라가며 배우기 좋아. Easy 머신부터 시작해."}],
        tip:"CTF = 해킹 게임. 점수가 곧 실력 증명이야.",
        quiz:{q:"HTB Retired 머신이 입문자에게 좋은 이유는?",opts:["더 쉬워서","공략법(Writeup)이 공개돼있어서","무료여서","빠르게 풀려서"],ans:1}}
    ]
  },
  {
    name:"상급", color:"#854F0B", period:"6개월~1년", pillBg:"#FAEEDA", pillColor:"#633806",
    lessons:[
      { name:"버그바운티 첫 신고", hint:"HackerOne에서 실제 취약점 제출",
        concepts:[{lbl:"프로그램 고르기",txt:"처음엔 규모가 작은 기업부터 해. 대기업은 이미 고수들이 다 뒤졌어. 신생 스타트업이나 새로 열린 프로그램을 노려."},{lbl:"리포트 작성법",txt:"취약점 이름, 재현 단계(1,2,3), 영향도, 스크린샷. 이 4가지가 다 있으면 수락 확률이 높아져."}],
        tip:"첫 신고 = 첫 알바 지원서. 잘 쓴 리포트가 실력만큼 중요해.",
        quiz:{q:"버그바운티 첫 도전에서 노리기 좋은 타겟은?",opts:["구글·애플 같은 대기업","새로 열린 소규모 프로그램","무작위 아무 사이트","학교 홈페이지"],ans:1}},
      { name:"취약점 체이닝", hint:"작은 버그 연결해 크리티컬로",
        concepts:[{lbl:"체이닝이란?",txt:"혼자선 Low 등급인 버그들을 연결하면 Critical이 될 수 있어. 정보 노출(Low) + SSRF(Medium) = 내부 서버 접근(Critical)."},{lbl:"SSRF",txt:"서버가 외부 URL을 가져오는 기능에서 내부 주소를 넣으면 내부 관리자 페이지에 접근 가능. 클라우드 환경에서 자주 발견돼."}],
        tip:"체이닝 = 레고 조각. 각각은 작아도 연결하면 큰 구조물이 돼.",

const TOTAL = phases.reduce((a,p)=>a+p.lessons.length,0);
let done = new Set();
let openCard = null;

function cid(pi,li){ return pi+'-'+li; }

function updateBar(){
  const p = Math.round(done.size/TOTAL*100);
  document.getElementById('bar').style.width=p+'%';
  document.getElementById('pct-txt').textContent=done.size+' / '+TOTAL+' 완료';
}

function render(){
  const root=document.getElementById('phases');
  root.innerHTML='';
  phases.forEach(function(ph,pi){
    const pdiv=document.createElement('div');
    pdiv.className='phase-wrap';
    const phDone=ph.lessons.filter(function(_,li){return done.has(cid(pi,li));}).length;
    pdiv.innerHTML='<div class="phase-header"><div class="phase-dot" style="background:'+ph.color+'"></div><span class="phase-name">'+ph.name+'</span><span class="phase-meta">'+phDone+'/'+ph.lessons.length+' · '+ph.period+'</span></div><div class="phase-cards" id="pc-'+pi+'"></div>';
    root.appendChild(pdiv);
    const pc=document.getElementById('pc-'+pi);
    ph.lessons.forEach(function(l,li){
      const id=cid(pi,li);
      const isDone=done.has(id);
      const isOpen=openCard===id;
      const card=document.createElement('div');
      card.className='card'+(isOpen?' active':'')+(isDone?' done':'');
      let inner='<div class="card-top"><div class="step-dot" style="background:'+ph.pillBg+';color:'+ph.color+'">'+(isDone?'<i class="ti ti-check" aria-hidden="true"></i>':(li+1))+'</div><div class="card-info"><div class="card-name">'+l.name+'</div><div class="card-hint">'+l.hint+'</div></div><i class="ti '+(isOpen?'ti-chevron-up':'ti-chevron-down')+'" style="font-size:16px;color:var(--color-text-tertiary)" aria-hidden="true"></i></div>';
      if(isOpen){
        inner+='<div class="lesson open"><span class="pill" style="background:'+ph.pillBg+';color:'+ph.color+'">'+ph.name+'</span>';
        l.concepts.forEach(function(c){inner+='<div class="concept"><div class="clbl">'+c.lbl+'</div><div class="ctxt">'+c.txt+'</div></div>';});
        inner+='<div class="tip-box"><div class="tip-lbl">비유로 이해하기</div><div class="tip-txt">'+l.tip+'</div></div>';
        inner+='<div class="qlbl">확인 문제 — '+l.quiz.q+'</div><div class="opts" id="opts-'+id+'">';
        l.quiz.opts.forEach(function(o,oi){inner+='<button class="opt" data-id="'+id+'" data-oi="'+oi+'" data-ans="'+l.quiz.ans+'">'+o+'</button>';});
        inner+='</div><div class="fb" id="fb-'+id+'"></div>';
        inner+='<button class="deep-btn" data-prompt="'+l.name+' 단원을 더 자세히 가르쳐줘. 실습 예제도 포함해서."><i class="ti ti-arrow-up-right" aria-hidden="true"></i> 더 깊게 배우기 ↗</button>';
        inner+='</div>';
      } else {
        inner+='<div class="lesson"></div>';
      }
      card.innerHTML=inner;
      card.querySelector('.card-top').addEventListener('click',function(){openCard=(openCard===id?null:id);render();});
      pc.appendChild(card);
    });
  });
  document.querySelectorAll('.opt').forEach(function(btn){
    btn.addEventListener('click',function(){
      const id=this.dataset.id;
      const chosen=parseInt(this.dataset.oi);
      const ans=parseInt(this.dataset.ans);
      const opts=document.querySelectorAll('#opts-'+id+' .opt');
      opts.forEach(function(o,oi){
        if(oi===ans) o.classList.add('correct');
        else if(oi===chosen&&oi!==ans) o.classList.add('wrong');
        o.style.pointerEvents='none';
      });
      const fb=document.getElementById('fb-'+id);
      if(chosen===ans){
        fb.textContent='정답이에요! 다음 단원으로 넘어가봐요.';
        fb.style.color='var(--color-text-success)';
        done.add(id);
        updateBar();
        render();
      } else {
        fb.textContent='아쉬워요. 설명을 다시 읽고 도전해봐요!';
        fb.style.color='var(--color-text-danger)';
        fb.style.display='block';
      }
      fb.style.display='block';
    });
  });
  document.querySelectorAll('.deep-btn').forEach(function(btn){
    btn.addEventListener('click',function(){sendPrompt(this.dataset.prompt);});
  });
  updateBar();
}

render();
</script>
